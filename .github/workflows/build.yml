name: Dopamine Flutter unsigned IPA

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: |
          set -x
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select --switch /Applications/Xcode_16.4.app
          else
            sudo xcode-select --switch /Applications/Xcode.app
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Initialize Flutter iOS host project
        run: |
          set -euo pipefail
          flutter config --no-enable-android

          # Generate the ephemeral .ios/ host for a Flutter module.
          # Use a temp dir to avoid overwriting existing files.
          TMPDIR=$(mktemp -d)
          flutter create --template=module \
            --org=com.opa334 \
            --project-name=dopamine \
            "$TMPDIR/dopamine"

          # Copy only the generated host directory into our repo.
          rm -rf .ios
          cp -a "$TMPDIR/dopamine/.ios" .ios/

          # Restore our pubspec (flutter create may have modified it in temp).
          flutter pub get

      - name: Analyze Dart
        run: dart analyze --fatal-infos

      - name: Build Flutter iOS AOT framework
        run: |
          set -euo pipefail
          flutter build ios-framework \
            --no-debug --no-profile --no-codesign \
            --output=Application/Frameworks/FlutterProducts

      - name: Install Procursus and ldid
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid make sed coreutils findutils

      - name: Download bootstraps
        working-directory: Application/Dopamine/Resources
        run: ./download_bootstraps.sh

      - name: Prepare BaseBin include headers
        run: |
          set -euo pipefail
          cd BaseBin
          rm -rf .include
          mkdir -p .include
          cp -r _external/include/* .include
          # Remove bundled XPC headers if the SDK already provides them (iOS 17.4+).
          SDK_XPC="$(xcrun --sdk iphoneos --show-sdk-path)/usr/include/xpc.modulemap"
          if [ -f "$SDK_XPC" ]; then
            rm -rf .include/xpc
          fi

      - name: Build native application with embedded Flutter framework
        working-directory: Application
        env:
          COMMIT_HASH: ${{ github.sha }}
        run: |
          set -euo pipefail
          xcodebuild -project Dopamine.xcodeproj \
            -scheme Dopamine \
            -configuration Release \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY='' \
            CODE_SIGN_ENTITLEMENTS='' \
            COMPILER_INDEX_STORE_ENABLE=NO \
            GCC_PREPROCESSOR_DEFINITIONS='NIGHTLY=1 COMMIT_HASH="${COMMIT_HASH}"' \
            FRAMEWORK_SEARCH_PATHS='$(inherited) "$(SRCROOT)/Frameworks/FlutterProducts/Release"' \
            OTHER_LDFLAGS='$(inherited) -framework Flutter' \
            build | xcbeautify

      - name: Embed Flutter framework and create unsigned IPA
        run: |
          set -euo pipefail
          APP="Application/build/Build/Products/Release-iphoneos/Dopamine.app"
          ENTITLEMENTS="Application/Dopamine/Dopamine.entitlements"
          test -d "$APP"

          mkdir -p "$APP/Frameworks"
          cp -a "Application/Frameworks/FlutterProducts/Release/Flutter.xcframework" "$APP/Frameworks/"
          ldid -S"$ENTITLEMENTS" "$APP/Dopamine"

          rm -rf Payload Dopamine.ipa
          mkdir Payload
          cp -a "$APP" Payload/Dopamine.app
          zip -qry Dopamine.ipa Payload
          rm -rf Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: Dopamine-Flutter-${{ github.sha }}
          path: Dopamine.ipa
          if-no-files-found: error



